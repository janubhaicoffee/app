[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect function calls to /.netlify/functions/catalog -> /api/catalog for cleaner URLs
[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200
